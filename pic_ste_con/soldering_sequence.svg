<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" fill="#f4f5f7"/>
  <text x="600" y="34" font-size="23" font-weight="bold" text-anchor="middle" fill="#111">Soldering Sequence — start to end</text>
  <text x="600" y="55" font-size="13" text-anchor="middle" fill="#555">Ground first → power (test) → sockets → logic (test) → set current → signals → sensors → motors → insert modules last</text>

  <!-- arrowheads between left-column boxes -->
  <g stroke="#555" stroke-width="2" marker-end="url(#arr)">
    <line x1="300" y1="132" x2="300" y2="148"/>
    <line x1="300" y1="222" x2="300" y2="238"/>
    <line x1="300" y1="312" x2="300" y2="328"/>
    <line x1="300" y1="402" x2="300" y2="418"/>
    <line x1="300" y1="492" x2="300" y2="508"/>
    <line x1="300" y1="582" x2="300" y2="598"/>
  </g>
  <!-- arrowheads between right-column boxes -->
  <g stroke="#555" stroke-width="2" marker-end="url(#arr)">
    <line x1="900" y1="222" x2="900" y2="238"/>
    <line x1="900" y1="312" x2="900" y2="328"/>
    <line x1="900" y1="402" x2="900" y2="418"/>
    <line x1="900" y1="492" x2="900" y2="508"/>
    <line x1="900" y1="582" x2="900" y2="598"/>
  </g>
  <!-- connector from GATE2 (left, bottom) up to step 5 (right, top) via the gutter -->
  <polyline points="560,640 600,640 600,150 656,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== START ===== -->
  <rect x="100" y="92" width="400" height="40" rx="20" fill="#2e7d32"/>
  <text x="300" y="117" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">START · bare perfboard + plan on paper</text>

  <!-- ===== LEFT COLUMN STEPS ===== -->
  <!-- 1 -->
  <rect x="100" y="150" width="400" height="72" rx="8" fill="#fff" stroke="#333"/>
  <circle cx="126" cy="176" r="14" fill="#1976d2"/><text x="126" y="181" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
  <text x="150" y="176" font-size="13.5" font-weight="bold" fill="#111">Ground bus first (BLACK)</text>
  <text x="150" y="194" font-size="11.5" fill="#555">Lay/solder the common GND rail — the reference</text>
  <text x="150" y="210" font-size="11.5" fill="#555">for everything else.</text>

  <!-- 2 -->
  <rect x="100" y="240" width="400" height="72" rx="8" fill="#fff" stroke="#333"/>
  <circle cx="126" cy="266" r="14" fill="#1976d2"/><text x="126" y="271" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
  <text x="150" y="266" font-size="13.5" font-weight="bold" fill="#111">Power distribution (RED)</text>
  <text x="150" y="284" font-size="11.5" fill="#555">Jack → 24V switch → buck + drivers switch →</text>
  <text x="150" y="300" font-size="11.5" fill="#555">both VMOT rails + 220µF caps. No modules yet.</text>

  <!-- GATE 1 -->
  <rect x="100" y="330" width="400" height="72" rx="8" fill="#fff8e1" stroke="#e0c060" stroke-width="2"/>
  <text x="126" y="360" font-size="18" text-anchor="middle">⚠</text>
  <text x="150" y="358" font-size="13.5" font-weight="bold" fill="#8a6d00">TEST GATE 1 — before any module</text>
  <text x="150" y="376" font-size="11.5" fill="#6b5500">buck OUT = 5 V · each VMOT = 24 V ·</text>
  <text x="150" y="392" font-size="11.5" fill="#6b5500">NO short VMOT↔GND / 5V↔GND</text>

  <!-- 3 -->
  <rect x="100" y="420" width="400" height="72" rx="8" fill="#fff" stroke="#333"/>
  <circle cx="126" cy="446" r="14" fill="#1976d2"/><text x="126" y="451" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text>
  <text x="150" y="446" font-size="13.5" font-weight="bold" fill="#111">Solder the SOCKETS</text>
  <text x="150" y="464" font-size="11.5" fill="#555">Female headers for the Pico + both drivers</text>
  <text x="150" y="480" font-size="11.5" fill="#555">(modules stay OUT for now).</text>

  <!-- 4 -->
  <rect x="100" y="510" width="400" height="72" rx="8" fill="#fff" stroke="#333"/>
  <circle cx="126" cy="536" r="14" fill="#1976d2"/><text x="126" y="541" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">4</text>
  <text x="150" y="536" font-size="13.5" font-weight="bold" fill="#111">Logic power</text>
  <text x="150" y="554" font-size="11.5" fill="#555">Buck 5V → VSYS · 3V3 → both VIO (WHITE) ·</text>
  <text x="150" y="570" font-size="11.5" fill="#555">all driver GND → bus.</text>

  <!-- GATE 2 -->
  <rect x="100" y="600" width="400" height="72" rx="8" fill="#fff8e1" stroke="#e0c060" stroke-width="2"/>
  <text x="126" y="630" font-size="18" text-anchor="middle">⚠</text>
  <text x="150" y="628" font-size="13.5" font-weight="bold" fill="#8a6d00">TEST GATE 2 — insert Pico ONLY</text>
  <text x="150" y="646" font-size="11.5" fill="#6b5500">USB power → Pico boots (READY main.py) ·</text>
  <text x="150" y="662" font-size="11.5" fill="#6b5500">3V3 present at both VIO pads.</text>

  <!-- ===== RIGHT COLUMN STEPS ===== -->
  <!-- 5 -->
  <rect x="700" y="150" width="400" height="72" rx="8" fill="#fff" stroke="#333"/>
  <circle cx="726" cy="176" r="14" fill="#1976d2"/><text x="726" y="181" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">5</text>
  <text x="750" y="176" font-size="13.5" font-weight="bold" fill="#111">Set driver current + microstep</text>
  <text x="750" y="194" font-size="11.5" fill="#555">VREF current on each TMC; MS1/MS2 =</text>
  <text x="750" y="210" font-size="11.5" fill="#b00020">prototype (keeps 6250-step MAIN valid).</text>

  <!-- 6 -->
  <rect x="700" y="240" width="400" height="72" rx="8" fill="#fff" stroke="#333"/>
  <circle cx="726" cy="266" r="14" fill="#1976d2"/><text x="726" y="271" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">6</text>
  <text x="750" y="266" font-size="13.5" font-weight="bold" fill="#111">Control wiring (colour-coded)</text>
  <text x="750" y="284" font-size="11.5" fill="#555">SM1: EN/STEP/DIR. SM2: STEP/DIR/EN +</text>
  <text x="750" y="300" font-size="11.5" fill="#555">UART (1 kΩ) + DIAG. Label by axis.</text>

  <!-- 7 -->
  <rect x="700" y="330" width="400" height="72" rx="8" fill="#fff" stroke="#333"/>
  <circle cx="726" cy="356" r="14" fill="#1976d2"/><text x="726" y="361" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">7</text>
  <text x="750" y="356" font-size="13.5" font-weight="bold" fill="#111">Sensors</text>
  <text x="750" y="374" font-size="11.5" fill="#555">Limit switch (BLUE + GND, add 100 nF) ·</text>
  <text x="750" y="390" font-size="11.5" fill="#555">button (VIOLET + GND). Keep blue away from 24 V.</text>

  <!-- 8 -->
  <rect x="700" y="420" width="400" height="72" rx="8" fill="#fff" stroke="#333"/>
  <circle cx="726" cy="446" r="14" fill="#1976d2"/><text x="726" y="451" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">8</text>
  <text x="750" y="446" font-size="13.5" font-weight="bold" fill="#111">Motor connectors</text>
  <text x="750" y="464" font-size="11.5" fill="#555">OA/OB → motor coils at the edge terminals.</text>
  <text x="750" y="480" font-size="11.5" fill="#555">Keep A1/A2 · B1/B2 pairs (else buzz/no spin).</text>

  <!-- 9 -->
  <rect x="700" y="510" width="400" height="72" rx="8" fill="#fff" stroke="#333"/>
  <circle cx="726" cy="536" r="14" fill="#1976d2"/><text x="726" y="541" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">9</text>
  <text x="750" y="536" font-size="13.5" font-weight="bold" fill="#111">Final check, then INSERT modules</text>
  <text x="750" y="554" font-size="11.5" fill="#555">Continuity + short check. Only now plug in the</text>
  <text x="750" y="570" font-size="11.5" fill="#555">Pico + both drivers.</text>

  <!-- END -->
  <rect x="700" y="600" width="400" height="44" rx="22" fill="#2e7d32"/>
  <text x="900" y="621" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#fff">END · power logic → drivers switch → bring-up in GUI</text>
  <text x="900" y="637" font-size="11" text-anchor="middle" fill="#d8f0d8">Jog → Home → MAIN/Move → Gripper → Cycle</text>

  <!-- bottom rule -->
  <text x="600" y="712" font-size="12.5" text-anchor="middle" fill="#b00020" font-weight="bold">Golden rule: build &amp; TEST all power BEFORE inserting the Pico/drivers — the modules go in LAST.</text>
  <text x="600" y="732" font-size="11.5" text-anchor="middle" fill="#555">Pairs with wiring_layout.svg (what connects where) and board_placement.svg (placement + 24 V/GND routing).</text>
</svg>
