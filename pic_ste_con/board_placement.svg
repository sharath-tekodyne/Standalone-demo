<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="holes" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.1" fill="#cfd4da"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1280" height="960" fill="#f4f5f7"/>
  <text x="640" y="32" font-size="23" font-weight="bold" text-anchor="middle" fill="#111">Perfboard Placement &amp; Power Routing — top-down view</text>
  <text x="640" y="54" font-size="13" text-anchor="middle" fill="#555">24 V (red) top rail · GND (black) bottom bus · logic in the centre · motors on the outer edges. Keeps high-current away from signals.</text>

  <!-- board -->
  <rect x="40" y="70" width="1200" height="820" rx="10" fill="#0f5132" opacity="0.06"/>
  <rect x="40" y="70" width="1200" height="820" rx="10" fill="url(#holes)" stroke="#7a8a99" stroke-width="2"/>

  <!-- ============ 24V RED RAIL (top) ============ -->
  <rect x="120" y="212" width="1040" height="12" rx="6" fill="#d32f2f"/>
  <text x="130" y="206" font-size="14" font-weight="bold" fill="#b00020">+24 V rail (RED, thick wire)</text>

  <!-- ============ GND BLACK BUS (bottom) ============ -->
  <rect x="80" y="838" width="1120" height="16" rx="8" fill="#111"/>
  <text x="90" y="832" font-size="14" font-weight="bold" fill="#111">COMMON GND BUS (BLACK, thick wire) — every ground drops straight down to here</text>

  <!-- ============ POWER INPUT CLUSTER (top-left) ============ -->
  <rect x="70" y="96" width="96" height="48" rx="5" fill="#fff" stroke="#333"/>
  <text x="118" y="116" font-size="12" text-anchor="middle" fill="#111">24 V JACK</text>
  <text x="118" y="132" font-size="10.5" text-anchor="middle" fill="#777">barrel, edge</text>

  <rect x="182" y="96" width="104" height="48" rx="5" fill="#fff" stroke="#333"/>
  <text x="234" y="115" font-size="11.5" text-anchor="middle" fill="#111">24 V SUPPLY</text>
  <text x="234" y="131" font-size="11.5" text-anchor="middle" fill="#111">switch</text>

  <rect x="302" y="96" width="112" height="48" rx="5" fill="#fff" stroke="#333"/>
  <text x="358" y="115" font-size="11.5" text-anchor="middle" fill="#111">DRIVERS</text>
  <text x="358" y="131" font-size="11.5" text-anchor="middle" fill="#111">switch</text>

  <rect x="430" y="96" width="150" height="48" rx="5" fill="#fff" stroke="#333"/>
  <text x="505" y="115" font-size="11.5" text-anchor="middle" fill="#111">BUCK 24→5 V</text>
  <text x="505" y="131" font-size="10.5" text-anchor="middle" fill="#777">OUT+ → Pico VSYS</text>

  <!-- power flow reds -->
  <line x1="166" y1="120" x2="182" y2="120" stroke="#d32f2f" stroke-width="4"/>
  <line x1="286" y1="120" x2="302" y2="120" stroke="#d32f2f" stroke-width="4"/>
  <line x1="358" y1="144" x2="358" y2="218" stroke="#d32f2f" stroke-width="4"/>          <!-- drivers switch feeds the 24V rail -->
  <line x1="414" y1="120" x2="430" y2="120" stroke="#d32f2f" stroke-width="4"/>          <!-- 24V switch also feeds buck -->
  <line x1="505" y1="144" x2="505" y2="300" stroke="#d32f2f" stroke-width="3.5"/>        <!-- buck 5V down to Pico VSYS -->
  <text x="512" y="270" font-size="11" fill="#b00020">5 V → VSYS</text>

  <!-- jack/switch/buck grounds down to bus -->
  <line x1="90" y1="144" x2="90" y2="838" stroke="#111" stroke-width="3"/>
  <line x1="470" y1="144" x2="470" y2="838" stroke="#111" stroke-width="2.5"/>
  <text x="96" y="820" font-size="10.5" fill="#555">jack −</text>
  <text x="476" y="820" font-size="10.5" fill="#555">buck −</text>

  <!-- ============ PICO (centre) ============ -->
  <rect x="540" y="300" width="200" height="430" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="640" y="324" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">PICO 2 W</text>
  <text x="640" y="342" font-size="10.5" text-anchor="middle" fill="#777">on female headers · USB at top edge</text>
  <text x="556" y="366" font-size="11" fill="#444">left pins → SM2 (GP0–5)</text>
  <text x="724" y="366" font-size="11" text-anchor="end" fill="#444">SM1 (GP18–20) ← right pins</text>
  <text x="640" y="392" font-size="11" text-anchor="middle" fill="#444">GP21 limit · GP22 button (lower-right)</text>
  <rect x="556" y="404" width="168" height="34" rx="4" fill="#ffffff" stroke="#999"/>
  <text x="640" y="425" font-size="11" text-anchor="middle" fill="#333">3V3 (pin36) → both VIO (WHITE)</text>
  <text x="640" y="470" font-size="11" text-anchor="middle" fill="#555">USB faces the board edge so you can</text>
  <text x="640" y="486" font-size="11" text-anchor="middle" fill="#555">plug it without removing the drivers</text>
  <!-- pico VSYS/GND -->
  <line x1="640" y1="730" x2="640" y2="838" stroke="#111" stroke-width="3"/>
  <text x="646" y="820" font-size="10.5" fill="#555">Pico GND</text>

  <!-- ============ SM1 DRIVER (left) ============ -->
  <rect x="150" y="360" width="170" height="170" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="235" y="384" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">SM1 TMC2208</text>
  <text x="235" y="401" font-size="10.5" text-anchor="middle" fill="#777">platform · socketed</text>
  <text x="235" y="424" font-size="11" text-anchor="middle" fill="#0a7">▲ VMOT + GND to rails</text>
  <text x="235" y="446" font-size="11" text-anchor="middle" fill="#0a7">◄ motor pins to edge</text>
  <text x="235" y="468" font-size="11" text-anchor="middle" fill="#0a7">logic pins to Pico ►</text>
  <text x="235" y="492" font-size="10.5" text-anchor="middle" fill="#777">set MS1/MS2 = prototype</text>
  <text x="235" y="512" font-size="10.5" text-anchor="middle" fill="#777">set VREF current</text>
  <!-- SM1 VMOT up to rail + cap -->
  <line x1="210" y1="360" x2="210" y2="224" stroke="#d32f2f" stroke-width="4"/>
  <rect x="196" y="300" width="12" height="26" rx="3" fill="#d32f2f"/>
  <text x="150" y="316" font-size="10.5" fill="#b00020">220µF</text>
  <text x="150" y="330" font-size="10.5" fill="#b00020">at VMOT</text>
  <!-- SM1 GND down to bus -->
  <line x1="262" y1="530" x2="262" y2="838" stroke="#111" stroke-width="3"/>
  <!-- SM1 logic to Pico (short, centre) -->
  <line x1="320" y1="470" x2="540" y2="470" stroke="#795548" stroke-width="3"/>
  <text x="360" y="463" font-size="10.5" fill="#5d4037">STEP/DIR/EN — short, colour-coded</text>
  <!-- SM1 motor to left edge -->
  <rect x="52" y="410" width="74" height="110" rx="5" fill="#eef5ff" stroke="#9db8dd"/>
  <text x="89" y="430" font-size="10.5" text-anchor="middle" fill="#234">SM1</text>
  <text x="89" y="445" font-size="10.5" text-anchor="middle" fill="#234">MOTOR</text>
  <text x="89" y="463" font-size="9.5" text-anchor="middle" fill="#555">screw/JST</text>
  <line x1="126" y1="465" x2="150" y2="465" stroke="#666" stroke-width="3"/>

  <!-- ============ SM2 DRIVER (right) ============ -->
  <rect x="960" y="360" width="170" height="170" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="1045" y="384" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">SM2 TMC2209</text>
  <text x="1045" y="401" font-size="10.5" text-anchor="middle" fill="#777">gripper · socketed</text>
  <text x="1045" y="424" font-size="11" text-anchor="middle" fill="#0a7">▲ VMOT + GND to rails</text>
  <text x="1045" y="446" font-size="11" text-anchor="middle" fill="#0a7">motor pins to edge ►</text>
  <text x="1045" y="468" font-size="11" text-anchor="middle" fill="#0a7">◄ logic + UART to Pico</text>
  <text x="1045" y="492" font-size="10.5" text-anchor="middle" fill="#777">UART: 1 kΩ at PDN</text>
  <text x="1045" y="512" font-size="10.5" text-anchor="middle" fill="#777">DIAG wired (parked)</text>
  <!-- SM2 VMOT up to rail + cap -->
  <line x1="1070" y1="360" x2="1070" y2="224" stroke="#d32f2f" stroke-width="4"/>
  <rect x="1072" y="300" width="12" height="26" rx="3" fill="#d32f2f"/>
  <text x="1090" y="316" font-size="10.5" fill="#b00020">220µF</text>
  <text x="1090" y="330" font-size="10.5" fill="#b00020">at VMOT</text>
  <!-- SM2 GND down to bus -->
  <line x1="1018" y1="530" x2="1018" y2="838" stroke="#111" stroke-width="3"/>
  <!-- SM2 logic to Pico -->
  <line x1="740" y1="470" x2="960" y2="470" stroke="#388e3c" stroke-width="3"/>
  <text x="770" y="463" font-size="10.5" fill="#2e7d32">STEP/DIR/EN/UART/DIAG — short</text>
  <!-- SM2 motor to right edge -->
  <rect x="1154" y="410" width="74" height="110" rx="5" fill="#eef5ff" stroke="#9db8dd"/>
  <text x="1191" y="430" font-size="10.5" text-anchor="middle" fill="#234">SM2</text>
  <text x="1191" y="445" font-size="10.5" text-anchor="middle" fill="#234">MOTOR</text>
  <text x="1191" y="463" font-size="9.5" text-anchor="middle" fill="#555">screw/JST</text>
  <line x1="1130" y1="465" x2="1154" y2="465" stroke="#666" stroke-width="3"/>

  <!-- ============ SENSORS (bottom-centre, away from 24V rail) ============ -->
  <rect x="500" y="762" width="130" height="58" rx="5" fill="#e8f0fe" stroke="#1976d2"/>
  <text x="565" y="784" font-size="12" text-anchor="middle" fill="#0d47a1">LIMIT SWITCH</text>
  <text x="565" y="800" font-size="10" text-anchor="middle" fill="#555">GP21 + GND · 100nF</text>
  <text x="565" y="814" font-size="9.5" text-anchor="middle" fill="#b00020">keep BLUE wire low, away from red rail</text>
  <line x1="565" y1="762" x2="600" y2="600" stroke="#1976d2" stroke-width="2.5"/>

  <rect x="650" y="762" width="120" height="58" rx="5" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="710" y="784" font-size="12" text-anchor="middle" fill="#4a148c">PUSH BUTTON</text>
  <text x="710" y="800" font-size="10" text-anchor="middle" fill="#555">GP22 + GND</text>
  <line x1="710" y1="762" x2="690" y2="600" stroke="#7b1fa2" stroke-width="2.5"/>

  <!-- ============ ROUTING RULES BOX ============ -->
  <rect x="820" y="600" width="404" height="212" rx="8" fill="#ffffff" stroke="#ccc"/>
  <text x="836" y="622" font-size="14" font-weight="bold" fill="#111">Routing rules</text>
  <g font-size="11.5" fill="#333">
    <text x="836" y="646">1. 24 V (RED) on the top rail; short thick DROPS down to</text>
    <text x="852" y="662">each driver VMOT. 220 µF cap right at each VMOT→GND.</text>
    <text x="836" y="682">2. GND (BLACK) single bus along the bottom; every part's</text>
    <text x="852" y="698">GND drops STRAIGHT DOWN to it (one shared reference).</text>
    <text x="836" y="718">3. Logic (STEP/DIR/EN/UART) stays in the CENTRE, short</text>
    <text x="852" y="734">runs between Pico and the two drivers.</text>
    <text x="836" y="754">4. Motor wires go straight OUT to the edge connectors —</text>
    <text x="852" y="770">high current, kept away from the logic zone.</text>
    <text x="836" y="790">5. Limit-switch (BLUE) routed low/short, AWAY from the</text>
    <text x="852" y="806">red 24 V rail and motor wires (EMI we hit earlier).</text>
  </g>

  <!-- ============ ZONE LABELS ============ -->
  <text x="640" y="250" font-size="11" text-anchor="middle" fill="#b00020">HIGH-CURRENT ZONE (24 V, VMOT, motors) — keep at top &amp; outer edges</text>
  <text x="640" y="556" font-size="11" text-anchor="middle" fill="#2e7d32">LOGIC ZONE (3V3 signals) — centre, short runs</text>
</svg>
